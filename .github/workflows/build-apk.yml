name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Files & Capacitor
        run: |
          mkdir -p _tmp www
          ZIP_FILE=$(ls -t *.zip | head -n 1)
          unzip -o "$ZIP_FILE" -d _tmp
          INDEX_DIR=$(dirname "$(find _tmp -name index.html | head -n 1)")
          cp -r "$INDEX_DIR"/. www/

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.vihanga.globaltranslator",
            "appName": "Global Translator",
            "webDir": "www",
            "server": {
              "url": "https://vihangarasanjanawithanage39-hash.github.io/GlobalTranslator-App/",
              "cleartext": false
            }
          }
          EOF

          npx cap add android

          # Apply Globe Icon
          for d in android/app/src/main/res/mipmap-*; do
            [ -f "$d/ic_launcher.png" ] && cp www/icon-512.png "$d/ic_launcher.png"
            [ -f "$d/ic_launcher_round.png" ] && cp www/icon-512.png "$d/ic_launcher_round.png"
            [ -f "$d/ic_launcher_foreground.png" ] && cp www/icon-512.png "$d/ic_launcher_foreground.png"
          done
          if [ -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            sed -i 's|<color name="ic_launcher_background">.*</color>|<color name="ic_launcher_background">#09101d</color>|' android/app/src/main/res/values/ic_launcher_background.xml
          fi

          # Add Camera & Microphone permissions
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build, Zipalign & Sign Release APK (v1+v2+v3)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias globaltrans -keyalg RSA -keysize 2048 -validity 10000 -storepass vihanga123 -keypass vihanga123 -dname "CN=W.Vihanga Rasanjana Withanage, O=GlobalTranslator, C=LK"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks ../release.keystore --ks-key-alias globaltrans --ks-pass pass:vihanga123 --key-pass pass:vihanga123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out ../Global-Translator.apk ../aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose ../Global-Translator.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Global Translator Pro (Latest APK)
          body: "Global Translator Pro — Created by W.Vihanga Rasanjana Withanage"
          files: Global-Translator.apk
