name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Files & Capacitor
        run: |
          mkdir -p _tmp www
          ZIP_FILE=$(ls -t *.zip | head -n 1)
          unzip -o "$ZIP_FILE" -d _tmp
          INDEX_DIR=$(dirname "$(find _tmp -name index.html | head -n 1)")
          cp -r "$INDEX_DIR"/. www/

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.vihanga.globaltranslator",
            "appName": "Global Translator",
            "webDir": "www",
            "server": {
              "url": "https://vihangarasanjanawithanage39-hash.github.io/GlobalTranslator-App/",
              "cleartext": false
            }
          }
          EOF

          npx cap add android

          # Add Camera & Microphone permissions for OCR & Live Voice
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Global-Translator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Translator-APK
          path: Global-Translator.apk
